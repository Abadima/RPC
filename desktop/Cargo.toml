[package]
name = "Parousia-Desktop"
version = "1.0.0-beta.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dirs = "7.0.0"
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = "0.30.0"

# Idle-most-of-the-time tray app, so size matters more than peak speed: on a
# static Linux build `z` is 1.01 MB against 1.21 MB at the default `3`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Windows-only, and already in the tree through `dirs`: the tray icon and
# console handling call Win32 directly instead of pulling in a GUI framework.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
