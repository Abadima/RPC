[package]
name = "Parousia-Desktop"
version = "1.0.0-beta.2"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dirs = "7.0.0"
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The WebSocket only: `link/http.rs` does the upgrade handshake.
tungstenite = { version = "0.30.0", default-features = false }

[dev-dependencies]
# Tests connect with tungstenite's own client, which checks the handshake independently.
tungstenite = "0.30.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
