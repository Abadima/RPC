name: Bug Report
description: Report a problem with PAROUSIA
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use [private reporting](https://github.com/Abadima/RPC/security/advisories/new) instead of this form.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of PAROUSIA is affected?
      options:
        - Browser extension
        - Desktop application
        - Discord adapter
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser (and version), or PAROUSIA version/commit
      placeholder: e.g. Windows 11, Chrome 128, commit abc1234
    validations:
      required: false
