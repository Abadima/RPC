name: Release

# A version tag on main (v1.2.3, or v1.2.3-rc.1 for a pre-release) builds,
# tests, and publishes a GitHub Release with nothing to click: the files,
# SHA256SUMS, build provenance, and the CHANGELOG.md section for that version
# as its notes. Run it by hand from any branch for a dry run: it checks and
# builds all of it and keeps the files as a workflow artifact, and publishes
# nothing. A release made by hand for the tag is filled in, not an error. Builds of
# main between releases are Nightly's (dev-<commit>).
#
# The build is build.yml, shared with Nightly.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # A release is cut from main, never from a tag on a side branch.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$REF_NAME is not on main"
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version="$(jq -r .version browser/manifests/chromium.json)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release with nothing written about it doesn't go out.
      - name: Check the changelog has this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.mjs "$VERSION" > /dev/null

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  publish:
    name: Publish
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write. It builds nothing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      DESKTOP: ${{ needs.build.outputs.desktop }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      SOURCES: ${{ needs.build.outputs.sources }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Create the release
        run: |
          node scripts/changelog.mjs "$VERSION" > notes.md
          cat >> notes.md <<'EOF'

          ### Files

          | File | For |
          | --- | --- |
          | `parousia-desktop-windows-x86_64.exe` | Parousia Desktop, Windows 10/11 on Intel or AMD |
          | `parousia-desktop-windows-aarch64.exe` | Parousia Desktop, Windows 11 on ARM64 |
          | `parousia-desktop-linux-x86_64` | Parousia Desktop, Linux on Intel or AMD (`chmod +x` it) |
          | `parousia-desktop-linux-aarch64` | Parousia Desktop, Linux on ARM64 (`chmod +x` it) |
          | `parousia-desktop-notices.txt` | The licenses of the Rust crates inside Parousia Desktop |
          | `parousia-chromium.zip` | The extension for Chrome, Edge, and other Chromium browsers |
          | `parousia-firefox.zip` | The extension for Firefox |
          | `parousia.user.js` | The userscript, for Violentmonkey, Tampermonkey, or ScriptCat |
          | `parousia.user.js.gz` | The same userscript, gzip-compressed |

          Check downloads with `sha256sum -c SHA256SUMS`, or verify where a file was built with `gh attestation verify <file> --repo <owner>/<repo>`.
          EOF
          sed -i "s|<owner>/<repo>|$GH_REPO|" notes.md
          printf '\nActivities built from: %s\n' "$SOURCES" >> notes.md
          # Read by the extension to tell whether a newer Desktop exists (shared/latest-desktop.ts).
          # Hidden from the page; keep the exact form.
          printf '\n<!-- parousia-desktop: %s -->\n' "$DESKTOP" >> notes.md
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease); fi
          # A release made by hand for this tag (a draft, or published with no files)
          # gets the files, the notes, and publishing; otherwise it's created here.
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Parousia $TAG" --notes-file notes.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" release/* --verify-tag --title "Parousia $TAG" --notes-file notes.md "${flags[@]}"
          fi
