name: Browser CI

on:
  push:
    branches: ["main", "pre-2.0"]
    paths:
      - "browser/**"
      - "assets/brand/**"
      - "adapters/discord/**"
      - ".github/workflows/browser-ci.yml"
  pull_request:
    branches: ["main", "pre-2.0"]
    paths:
      - "browser/**"
      - "assets/brand/**"
      - "adapters/discord/**"
      - ".github/workflows/browser-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Fetch Activity sources (main of each repository)
        run: bun run activities:fetch

      - name: Check Activities (native and PreMiD)
        run: bun run activities:check

      - name: Build (chromium, firefox, userscript)
        run: bun run build

      - name: Test
        run: bun test

      - name: Cache Firefox automation build
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('browser/bun.lock') }}

      - name: Fetch isolated Firefox for verification
        run: bun run firefox:setup

      - name: Runtime-verify the Firefox build
        run: bun run firefox:verify

      - name: Audit dependencies
        run: bun audit
