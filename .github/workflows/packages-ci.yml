name: Packages CI

on:
  push:
    branches: ["main", "pre-2.0"]
    paths:
      - "packages/**"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    branches: ["main", "pre-2.0"]
    paths:
      - "packages/**"
      - ".github/workflows/packages-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test presence-view
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Test
        run: bun test
        working-directory: packages/presence-view
